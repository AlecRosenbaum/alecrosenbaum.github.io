{{ define "main" }}
<style type="text/css" media="screen">
  .container {
    margin: 10px auto;
    max-width: 600px;
    text-align: center;
  }
  h1 {
    margin: 30px 0;
    font-size: 4em;
    line-height: 1;
    letter-spacing: -1px;
  }
  .recipe-title {
    cursor: pointer;
  }
  .recipe-title:hover {
    text-decoration: underline;
  }
  .recipe {
    scroll-margin-top: 20px;
  }
  #search-input {
    padding: 10px;
    margin: 20px 0;
    border: 1px solid #ddd;
    border-radius: 4px;
    width: 100%;
    font-size: 16px;
    box-sizing: border-box;
  }
  #search-input:focus {
    outline: none;
    border-color: #9ecaed;
    box-shadow: 0 0 10px #9ecaed;
  }
  .recipe-content {
    display: none;
  }
  .recipe-content.open {
    display: block;
  }
</style>

<div class="wrapper">
  <h1 style="text-align: center">Recipes</h1>
  <input type="text" id="search-input" placeholder="Search recipes...">
  <div id="recipes-container"></div>
</div>

<script>
(function() {
  var container = document.getElementById('recipes-container');
  var searchInput = document.getElementById('search-input');
  var allRecipes = [];
  var openSlugs = new Set();
  var initialScrollDone = false;

  function slugify(name) {
    return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }

  function currentHashSlug() {
    try {
      return decodeURIComponent(location.hash.replace(/^#/, ''));
    } catch (e) {
      return location.hash.replace(/^#/, '');
    }
  }

  function setHash(slug) {
    var newUrl = location.pathname + location.search + (slug ? '#' + slug : '');
    history.replaceState(null, '', newUrl);
  }

  // Keep the screen awake while a recipe is open, so a phone propped up on the
  // counter doesn't sleep mid-cook. No-ops where the API is unavailable.
  var wakeLockSupported = 'wakeLock' in navigator;
  var wakeLock = null;
  var wakeLockPending = false;

  function requestWakeLock() {
    if (!wakeLockSupported || wakeLock || wakeLockPending) return;
    // The API only grants a lock to a visible page.
    if (document.visibilityState !== 'visible') return;
    wakeLockPending = true;
    navigator.wakeLock.request('screen').then(function(lock) {
      wakeLockPending = false;
      if (openSlugs.size === 0) {
        // Everything was collapsed again before the lock arrived.
        lock.release().catch(function() {});
        return;
      }
      wakeLock = lock;
      lock.addEventListener('release', function() {
        // Also fires when the browser drops the lock (page hidden, etc).
        if (wakeLock === lock) wakeLock = null;
      });
    }).catch(function() {
      // Denied by the browser (hidden page, battery saver, permissions policy).
      wakeLockPending = false;
    });
  }

  function releaseWakeLock() {
    if (!wakeLock) return;
    var lock = wakeLock;
    wakeLock = null;
    lock.release().catch(function() {});
  }

  function syncWakeLock() {
    if (openSlugs.size > 0) {
      requestWakeLock();
    } else {
      releaseWakeLock();
    }
  }

  if (wakeLockSupported) {
    document.addEventListener('visibilitychange', function() {
      // The lock is released whenever the page is hidden, so take it back.
      if (document.visibilityState === 'visible') syncWakeLock();
    });
  }

  function setOpen(div, title, recipe, open) {
    var content = div.querySelector('.recipe-content');
    if (open) {
      content.classList.add('open');
      title.textContent = '[-] ' + recipe.name;
      openSlugs.add(div.id);
    } else {
      content.classList.remove('open');
      title.textContent = '[+] ' + recipe.name;
      openSlugs.delete(div.id);
    }
    syncWakeLock();
  }

  function renderRecipe(recipe) {
    var slug = slugify(recipe.name);
    var div = document.createElement('div');
    div.className = 'recipe';
    div.id = slug;
    div.dataset.name = recipe.name.toLowerCase();

    var title = document.createElement('h2');
    title.className = 'recipe-title';
    title.textContent = '[+] ' + recipe.name;

    var content = document.createElement('div');
    content.className = 'recipe-content';

    var ingredientsTitle = document.createElement('strong');
    ingredientsTitle.textContent = 'Ingredients:';
    var ingredientsList = document.createElement('ul');
    for (var ingredient in recipe.ingredients) {
      var li = document.createElement('li');
      li.textContent = ingredient + ': ' + recipe.ingredients[ingredient];
      ingredientsList.appendChild(li);
    }

    var cookwareTitle = document.createElement('strong');
    cookwareTitle.textContent = 'Cookware:';
    var cookwareList = document.createElement('ul');
    recipe.cookware.forEach(function(item) {
      var li = document.createElement('li');
      li.textContent = item;
      cookwareList.appendChild(li);
    });

    var stepsTitle = document.createElement('strong');
    stepsTitle.textContent = 'Steps:';
    var stepsList = document.createElement('ul');
    recipe.steps.forEach(function(step) {
      var li = document.createElement('li');
      li.textContent = step.text;
      stepsList.appendChild(li);
    });

    content.appendChild(ingredientsTitle);
    content.appendChild(ingredientsList);
    content.appendChild(cookwareTitle);
    content.appendChild(cookwareList);
    content.appendChild(stepsTitle);
    content.appendChild(stepsList);

    title.addEventListener('click', function() {
      var willOpen = !content.classList.contains('open');
      setOpen(div, title, recipe, willOpen);
      if (willOpen) {
        setHash(slug);
      } else if (currentHashSlug() === slug) {
        setHash('');
      }
    });

    div.appendChild(title);
    div.appendChild(content);

    if (openSlugs.has(slug)) {
      setOpen(div, title, recipe, true);
    }

    return div;
  }

  function renderAllRecipes(recipes) {
    recipes.sort(function(a, b) { return a.name.localeCompare(b.name); });
    allRecipes = recipes;
    container.innerHTML = '';
    recipes.forEach(function(recipe) {
      container.appendChild(renderRecipe(recipe));
    });
    handleHash();
  }

  function handleHash() {
    var slug = currentHashSlug();
    if (!slug) return;
    var el = document.getElementById(slug);
    if (!el) return;
    var title = el.querySelector('.recipe-title');
    var content = el.querySelector('.recipe-content');
    if (title && content && !content.classList.contains('open')) {
      var recipe = allRecipes.find(function(r) { return slugify(r.name) === slug; });
      if (recipe) setOpen(el, title, recipe, true);
    }
    if (!initialScrollDone) {
      el.scrollIntoView({ behavior: 'auto', block: 'start' });
      initialScrollDone = true;
    }
  }

  window.addEventListener('hashchange', handleHash);

  function filterRecipes(query) {
    var q = query.toLowerCase();
    var recipeElements = container.querySelectorAll('.recipe');
    recipeElements.forEach(function(el) {
      el.style.display = el.dataset.name.includes(q) ? '' : 'none';
    });
  }

  searchInput.addEventListener('input', function(e) {
    filterRecipes(e.target.value);
  });

  // Try to render from cache immediately for instant display
  var cached = localStorage.getItem('recipes');
  if (cached) {
    try {
      renderAllRecipes(JSON.parse(cached));
    } catch(e) {}
  }

  // Fetch with ETag support
  fetch('/recipes.json', {
    headers: { 'If-None-Match': localStorage.getItem('recipesETag') || '' }
  })
  .then(function(response) {
    if (response.status === 304) {
      // Already rendered from cache
      if (!cached) {
        console.error('304 but no cache');
      }
    } else if (response.ok) {
      var eTag = response.headers.get('ETag');
      response.json().then(function(recipes) {
        localStorage.setItem('recipes', JSON.stringify(recipes));
        if (eTag) localStorage.setItem('recipesETag', eTag);
        renderAllRecipes(recipes);
      });
    } else {
      console.error('HTTP error', response.status);
    }
  })
  .catch(function(error) {
    console.error('Network error', error);
  });
})();
</script>
{{ end }}
