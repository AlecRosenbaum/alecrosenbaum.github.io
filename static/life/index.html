<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="theme-color" content="#0e0f12" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Life Counter</title>
<style>
  :root {
    --gap: 6px;
    --chrome: #0e0f12;
    --panel: #16181d;
    --line: #2c3039;
    --muted: #9aa1ad;
    --text: #f2f4f7;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--chrome);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* The table fills the viewport minus any notch/home-indicator insets. */
  #table {
    position: fixed;
    inset: 0;
    padding: calc(var(--gap) + env(safe-area-inset-top)) calc(var(--gap) + env(safe-area-inset-right))
             calc(var(--gap) + env(safe-area-inset-bottom)) calc(var(--gap) + env(safe-area-inset-left));
    display: grid;
    gap: var(--gap);
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
  }
  #table[data-count="2"] { grid-template-columns: 1fr; }

  .player {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    background: #333;
    /* The cq units below measure this panel, not the screen. */
    container-type: size;
  }
  .player[hidden] { display: none; }

  /* Rotating the inner wrapper also swaps the minus/plus zones, so the
     halves stay correct from wherever that player is sitting. */
  .inner {
    position: absolute;
    inset: 0;
    display: flex;
  }
  .player[data-rot="180"] .inner { transform: rotate(180deg); }

  /* A quarter turn is for a seat that is taller than it is wide: swapping the
     wrapper's width and height first lets the name, total and tap zones run
     along the panel's long edge instead of being squeezed across the short one.
     90 faces a player off the left edge of the phone, 270 one off the right. */
  .player[data-rot="90"] .inner,
  .player[data-rot="270"] .inner {
    inset: auto;
    top: 50%;
    left: 50%;
    width: 100cqh;
    height: 100cqw;
  }
  .player[data-rot="90"] .inner { transform: translate(-50%, -50%) rotate(90deg); }
  .player[data-rot="270"] .inner { transform: translate(-50%, -50%) rotate(-90deg); }

  /* Held sideways, those seats are already wider than they are tall, so the
     long edge is the one facing the far side of the phone again. */
  @media (orientation: landscape) {
    .player[data-rot="90"] .inner,
    .player[data-rot="270"] .inner {
      inset: 0;
      width: auto;
      height: auto;
      transform: rotate(180deg);
    }
  }

  .zone {
    flex: 1 1 50%;
    border: 0;
    margin: 0;
    padding: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    cursor: pointer;
  }
  .zone span {
    font-size: clamp(22px, 5vmin, 40px);
    font-weight: 600;
    opacity: 0.35;
    pointer-events: none;
  }
  .zone:active span { opacity: 0.75; }

  .readout {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .life {
    font-size: clamp(56px, 22vmin, 150px);
    font-weight: 700;
    line-height: 0.95;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  #table[data-count="2"] .life { font-size: clamp(72px, 26vmin, 190px); }

  .name {
    font-size: clamp(11px, 2.4vmin, 15px);
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.65;
    margin-bottom: 0.35em;
    max-width: 80%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Running total of the last few taps, so you can see what just happened. */
  .delta {
    height: 1.4em;
    margin-top: 0.25em;
    font-size: clamp(14px, 4vmin, 26px);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    opacity: 0;
    transition: opacity 180ms linear;
  }
  .delta.show { opacity: 0.7; }

  .player.dead .life { opacity: 0.45; }

  /* Settings ------------------------------------------------------------- */

  #gear {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--chrome);
    color: var(--muted);
    font-size: 20px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 5;
  }
  #table[data-count="2"] ~ #gear { width: 40px; height: 40px; font-size: 17px; }

  #settings {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: rgba(6, 7, 9, 0.72);
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  #settings[hidden] { display: none; }

  .sheet {
    width: 100%;
    max-width: 520px;
    max-height: 92%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--panel);
    border-radius: 18px 18px 0 0;
    border-top: 1px solid var(--line);
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
  }

  .sheet h2 {
    margin: 0 0 16px;
    font-size: 17px;
    letter-spacing: 0.02em;
  }

  .field { margin-bottom: 18px; }
  .field > label,
  .field > .label {
    display: block;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .segmented { display: flex; gap: 8px; flex-wrap: wrap; }

  .seg {
    flex: 1 1 0;
    min-width: 56px;
    padding: 11px 8px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #1d2028;
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .seg[aria-pressed="true"] {
    background: var(--text);
    color: #14161a;
    border-color: var(--text);
  }

  .life-input {
    width: 90px;
    padding: 11px 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #1d2028;
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    -moz-appearance: textfield;
  }
  .life-input::-webkit-outer-spin-button,
  .life-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .player-row[hidden] { display: none; }
  .player-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .player-row input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 11px 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #1d2028;
    color: var(--text);
    font-size: 15px;
  }
  .swatch {
    position: relative;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    border: 1px solid var(--line);
    flex: none;
    overflow: hidden;
  }
  .swatch input[type="color"] {
    position: absolute;
    inset: -6px;
    width: calc(100% + 12px);
    height: calc(100% + 12px);
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
  }

  .actions { display: flex; gap: 8px; }
  .btn {
    flex: 1;
    padding: 13px 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #1d2028;
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn.primary { background: var(--text); color: #14161a; border-color: var(--text); }

  .hint {
    margin: 14px 0 0;
    font-size: 12px;
    line-height: 1.5;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    .delta { transition: none; }
  }
</style>
</head>
<body>

<div id="table" data-count="2"></div>

<button id="gear" type="button" aria-label="Settings">&#9881;</button>

<div id="settings" hidden role="dialog" aria-modal="true" aria-label="Settings">
  <div class="sheet">
    <h2>Settings</h2>

    <div class="field">
      <span class="label">Players</span>
      <div class="segmented" id="count-group"></div>
    </div>

    <div class="field">
      <span class="label">Starting life</span>
      <div class="segmented">
        <button type="button" class="seg start-preset" data-life="20">20</button>
        <button type="button" class="seg start-preset" data-life="30">30</button>
        <button type="button" class="seg start-preset" data-life="40">40</button>
        <input type="number" class="life-input" id="start-input" min="1" max="999" inputmode="numeric" />
      </div>
    </div>

    <div class="field">
      <span class="label">Names &amp; colors</span>
      <div id="player-rows"></div>
    </div>

    <div class="actions">
      <button type="button" class="btn" id="new-game">New game</button>
      <button type="button" class="btn primary" id="close">Done</button>
    </div>

    <p class="hint">Tap a half to add or subtract 1. Press and hold for 10. Changing the starting life re-deals only before the first point of damage &mdash; mid-game it applies to the next New game.</p>
  </div>
</div>

<script>
(function () {
  var STORE = 'life-counter-v1';
  var MAX_PLAYERS = 4;
  var HOLD_MS = 450;
  var HOLD_STEP = 10;
  var DELTA_MS = 2200;

  var DEFAULT_PLAYERS = [
    { name: 'Player 1', color: '#2f7d55' },
    { name: 'Player 2', color: '#2a5c9a' },
    { name: 'Player 3', color: '#9a3630' },
    { name: 'Player 4', color: '#6b4ea8' }
  ];

  // Seat layout per player count. Every seat is turned so the top of its text
  // points across the phone, away from the player reading it. The two far seats
  // in a three-player game are half as wide as the phone and taller than they
  // are wide, so they take a quarter turn instead of a half: those players sit
  // along the left and right edges and read across the phone, not up it.
  var SEATS = {
    2: [
      { row: '2', col: '1', rot: 0 },
      { row: '1', col: '1', rot: 180 }
    ],
    3: [
      { row: '2', col: '1 / span 2', rot: 0 },
      { row: '1', col: '1', rot: 90 },
      { row: '1', col: '2', rot: 270 }
    ],
    4: [
      { row: '2', col: '1', rot: 0 },
      { row: '2', col: '2', rot: 0 },
      { row: '1', col: '1', rot: 180 },
      { row: '1', col: '2', rot: 180 }
    ]
  };

  var state = load();
  var deltas = [0, 0, 0, 0];
  var deltaTimers = [null, null, null, null];
  var els = [];

  function defaults() {
    return {
      count: 2,
      start: 40,
      players: DEFAULT_PLAYERS.map(function (p) {
        return { name: p.name, color: p.color, life: 40 };
      })
    };
  }

  function load() {
    var base = defaults();
    var raw;
    try {
      raw = JSON.parse(localStorage.getItem(STORE) || 'null');
    } catch (e) {
      raw = null;
    }
    if (!raw) return base;

    if (raw.count >= 2 && raw.count <= MAX_PLAYERS) base.count = raw.count | 0;
    if (raw.start >= 1 && raw.start <= 999) base.start = raw.start | 0;
    if (Array.isArray(raw.players)) {
      base.players.forEach(function (p, i) {
        var saved = raw.players[i];
        if (!saved) return;
        if (typeof saved.name === 'string' && saved.name) p.name = saved.name.slice(0, 24);
        if (/^#[0-9a-f]{6}$/i.test(saved.color)) p.color = saved.color;
        if (typeof saved.life === 'number' && isFinite(saved.life)) p.life = saved.life | 0;
        else p.life = base.start;
      });
    } else {
      base.players.forEach(function (p) { p.life = base.start; });
    }
    return base;
  }

  function save() {
    try {
      localStorage.setItem(STORE, JSON.stringify(state));
    } catch (e) {
      // Private mode or a full quota: the counter still works, it just forgets.
    }
  }

  // White text over a dark seat, near-black over a light one.
  function inkFor(hex) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    var luma = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return luma > 0.62 ? '#14161a' : '#ffffff';
  }

  function buzz(ms) {
    if (navigator.vibrate) {
      try { navigator.vibrate(ms); } catch (e) {}
    }
  }

  function build() {
    var table = document.getElementById('table');
    for (var i = 0; i < MAX_PLAYERS; i++) {
      var seat = document.createElement('section');
      seat.className = 'player';

      var inner = document.createElement('div');
      inner.className = 'inner';

      var minus = zone('−');
      var plus = zone('+');

      var readout = document.createElement('div');
      readout.className = 'readout';
      var name = document.createElement('div');
      name.className = 'name';
      var life = document.createElement('div');
      life.className = 'life';
      var delta = document.createElement('div');
      delta.className = 'delta';
      readout.appendChild(name);
      readout.appendChild(life);
      readout.appendChild(delta);

      inner.appendChild(minus);
      inner.appendChild(readout);
      inner.appendChild(plus);
      seat.appendChild(inner);
      table.appendChild(seat);

      els.push({ seat: seat, inner: inner, name: name, life: life, delta: delta });
      bind(minus, i, -1);
      bind(plus, i, 1);
    }
  }

  function zone(label) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'zone';
    var s = document.createElement('span');
    s.textContent = label;
    b.appendChild(s);
    return b;
  }

  function bind(el, index, sign) {
    var timer = null;
    var pointer = null;

    el.addEventListener('pointerdown', function (e) {
      if (pointer !== null) return;
      pointer = e.pointerId;
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      timer = setTimeout(function () {
        // Held long enough: this is the big step, and the release does nothing.
        timer = null;
        change(index, sign * HOLD_STEP);
        buzz(18);
      }, HOLD_MS);
    });

    el.addEventListener('pointerup', function (e) {
      if (e.pointerId !== pointer) return;
      pointer = null;
      if (timer === null) return; // the hold already fired
      clearTimeout(timer);
      timer = null;
      change(index, sign);
    });

    function abort(e) {
      if (e.pointerId !== pointer) return;
      pointer = null;
      if (timer !== null) { clearTimeout(timer); timer = null; }
    }
    el.addEventListener('pointercancel', abort);
    el.addEventListener('lostpointercapture', abort);

    // A long press would otherwise pop the OS text/callout menu.
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }

  function change(index, amount) {
    var p = state.players[index];
    p.life += amount;

    deltas[index] += amount;
    if (deltaTimers[index]) clearTimeout(deltaTimers[index]);
    deltaTimers[index] = setTimeout(function () {
      deltas[index] = 0;
      deltaTimers[index] = null;
      paint(index);
    }, DELTA_MS);

    save();
    paint(index);
  }

  function paint(index) {
    var p = state.players[index];
    var el = els[index];
    el.life.textContent = p.life;
    el.name.textContent = p.name;
    el.seat.classList.toggle('dead', p.life <= 0);

    var d = deltas[index];
    el.delta.textContent = d > 0 ? '+' + d : d < 0 ? '−' + Math.abs(d) : '';
    el.delta.classList.toggle('show', d !== 0);
  }

  function render() {
    var table = document.getElementById('table');
    table.setAttribute('data-count', state.count);
    var seats = SEATS[state.count];

    els.forEach(function (el, i) {
      var active = i < state.count;
      el.seat.hidden = !active;
      if (!active) return;

      var seat = seats[i];
      el.seat.style.gridRow = seat.row;
      el.seat.style.gridColumn = seat.col;
      el.seat.dataset.rot = seat.rot;
      el.seat.style.background = state.players[i].color;
      el.seat.style.color = inkFor(state.players[i].color);
      paint(i);
    });
  }

  /* Settings ------------------------------------------------------------- */

  var settings = document.getElementById('settings');

  function buildSettings() {
    var group = document.getElementById('count-group');
    for (var n = 2; n <= MAX_PLAYERS; n++) {
      (function (n) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'seg';
        b.textContent = n;
        b.addEventListener('click', function () {
          setCount(n);
        });
        group.appendChild(b);
      })(n);
    }

    var rows = document.getElementById('player-rows');
    for (var i = 0; i < MAX_PLAYERS; i++) {
      (function (i) {
        var row = document.createElement('div');
        row.className = 'player-row';

        var swatch = document.createElement('div');
        swatch.className = 'swatch';
        var color = document.createElement('input');
        color.type = 'color';
        color.addEventListener('input', function () {
          state.players[i].color = color.value;
          save();
          render();
        });
        swatch.appendChild(color);

        var name = document.createElement('input');
        name.type = 'text';
        name.maxLength = 24;
        name.autocomplete = 'off';
        name.addEventListener('input', function () {
          state.players[i].name = name.value;
          save();
          paint(i);
        });

        row.appendChild(swatch);
        row.appendChild(name);
        rows.appendChild(row);
        row.dataset.index = i;
        row._color = color;
        row._name = name;
      })(i);
    }

    Array.prototype.forEach.call(document.querySelectorAll('.start-preset'), function (b) {
      b.addEventListener('click', function () {
        setStart(parseInt(b.dataset.life, 10));
      });
    });

    var startInput = document.getElementById('start-input');
    startInput.addEventListener('change', function () {
      var v = parseInt(startInput.value, 10);
      if (!isFinite(v)) v = state.start;
      setStart(Math.min(999, Math.max(1, v)));
    });

    document.getElementById('new-game').addEventListener('click', newGame);
    document.getElementById('close').addEventListener('click', closeSettings);
    document.getElementById('gear').addEventListener('click', openSettings);
    settings.addEventListener('click', function (e) {
      if (e.target === settings) closeSettings();
    });
  }

  function syncSettings() {
    Array.prototype.forEach.call(document.querySelectorAll('#count-group .seg'), function (b, i) {
      b.setAttribute('aria-pressed', String(i + 2 === state.count));
    });
    Array.prototype.forEach.call(document.querySelectorAll('.start-preset'), function (b) {
      b.setAttribute('aria-pressed', String(parseInt(b.dataset.life, 10) === state.start));
    });
    document.getElementById('start-input').value = state.start;

    Array.prototype.forEach.call(document.querySelectorAll('.player-row'), function (row, i) {
      row.hidden = i >= state.count;
      row._color.value = state.players[i].color;
      row._name.value = state.players[i].name;
    });
  }

  function setCount(n) {
    // Players already in the game keep their totals; anyone joining starts fresh.
    for (var i = state.count; i < n; i++) state.players[i].life = state.start;
    state.count = n;
    save();
    render();
    syncSettings();
  }

  function setStart(v) {
    // Safe to re-deal only if nobody has taken damage yet; mid-game this just
    // sets what the next New game will deal out.
    var untouched = state.players.slice(0, state.count).every(function (p) {
      return p.life === state.start;
    });
    state.start = v;
    if (untouched) resetLife();
    save();
    render();
    syncSettings();
  }

  function resetLife() {
    state.players.forEach(function (p) { p.life = state.start; });
    deltas = [0, 0, 0, 0];
    deltaTimers.forEach(function (t) { if (t) clearTimeout(t); });
    deltaTimers = [null, null, null, null];
  }

  function newGame() {
    resetLife();
    save();
    render();
    closeSettings();
  }

  function openSettings() {
    syncSettings();
    settings.hidden = false;
  }

  function closeSettings() {
    settings.hidden = true;
  }

  /* Keep the screen awake -------------------------------------------------
     A game runs long past the phone's sleep timer, and nobody wants to unlock
     between turns. No-ops where the API is unavailable. */

  var wakeLockSupported = 'wakeLock' in navigator;
  var wakeLock = null;
  var wakeLockPending = false;

  function requestWakeLock() {
    if (!wakeLockSupported || wakeLock || wakeLockPending) return;
    if (document.visibilityState !== 'visible') return;
    wakeLockPending = true;
    navigator.wakeLock.request('screen').then(function (lock) {
      wakeLockPending = false;
      wakeLock = lock;
      lock.addEventListener('release', function () {
        if (wakeLock === lock) wakeLock = null;
      });
    }).catch(function () {
      wakeLockPending = false;
    });
  }

  if (wakeLockSupported) {
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') requestWakeLock();
    });
    requestWakeLock();
  }

  build();
  buildSettings();
  render();
})();
</script>
</body>
</html>
